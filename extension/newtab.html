<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aistim Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="btn-settings" class="gear" type="button" title="Pengaturan" aria-label="Pengaturan">⚙</button>

  <main class="board">
    <section class="hero">
      <div id="clock" class="clock">00:00</div>
      <div id="date" class="date"></div>
      <div id="greeting" class="greeting"></div>
    </section>

    <section class="quote">
      <p id="quote-text"></p>
      <small id="quote-author"></small>
    </section>

    <section class="todo">
      <h2>Tugas</h2>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Tambah tugas, tekan Enter" autocomplete="off" required>
      </form>
      <ul id="todo-list"></ul>
      <div class="todo-tools">
        <button id="btn-export" type="button">Ekspor</button>
        <button id="btn-import" type="button">Impor</button>
        <button id="btn-clear-done" type="button">Hapus yang selesai</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="todo-msg" class="msg" role="status"></p>
    </section>
  </main>

  <dialog id="dlg-menu">
    <form method="dialog" id="form-menu">
      <h2 id="menu-title"></h2>
      <p id="menu-text" hidden></p>
      <input id="menu-input" type="text" maxlength="30" autocomplete="off" hidden>
      <menu>
        <button type="button" id="menu-cancel">Batal</button>
        <button type="submit" id="menu-ok">OK</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlg-settings">
    <form method="dialog" id="form-settings">
      <h2>Pengaturan</h2>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="1" role="tab">Umum</button>
        <button type="button" class="tab" data-tab="2" role="tab">Menu</button>
      </div>

      <div id="tab-1" class="tab-panel">
        <label>Tampilan
          <select id="set-view">
            <option value="board">Board</option>
            <option value="start">Aistim</option>
            <option value="sync">Aistim.sync</option>
          </select>
        </label>

        <label>Nama
          <input id="set-name" type="text" maxlength="30" placeholder="Opsional, dipakai di sapaan" autocomplete="off">
        </label>

        <label class="row">
          <input id="set-24h" type="checkbox"> Format jam 24 jam
        </label>

        <label>Latar
          <select id="set-bg">
            <option value="harian">Berganti tiap hari</option>
            <option value="warna">Pilih warna</option>
            <option value="gambar">Gambar sendiri</option>
          </select>
        </label>

        <label id="row-warna" hidden>Warna
          <select id="set-grad"></select>
        </label>

        <div id="row-gambar" hidden>
          <input id="set-img" type="file" accept="image/*">
          <small id="img-info"></small>
        </div>
      </div>

      <div id="tab-2" class="tab-panel" hidden>
        <div id="menu-table">
          <table class="crud">
            <thead><tr><th>#</th><th>Menu</th><th class="aksi"><button type="button" id="btn-add-view" class="ico pri" title="Tambah menu" aria-label="Tambah menu"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></th></tr></thead>
            <tbody id="view-list"></tbody>
          </table>
          <small>✓ = pakai sebagai tampilan (lalu tekan Simpan di bawah) · &lt;/&gt; = edit HTML · ✎ = ubah nama · 🗑 = hapus · + = tambah menu.</small>
        </div>

        <div id="menu-editor" hidden>
          <div id="ed-title" class="views-title"></div>
          <textarea id="ed-text" spellcheck="false" autocapitalize="off"></textarea>
          <div class="views-add">
            <span id="ed-msg"></span>
            <button type="button" id="ed-reset" hidden>Kembalikan</button>
            <button type="button" id="ed-cancel">Batal</button>
            <button type="button" id="ed-save" class="pri">Simpan HTML</button>
          </div>
        </div>
      </div>

      <menu>
        <button value="cancel" type="button" id="btn-cancel">Batal</button>
        <button value="ok" type="submit" id="btn-save">Simpan</button>
      </menu>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
