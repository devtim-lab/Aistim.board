<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aistim.sync</title>
<style>
html,body{height:100%;margin:0;background:#0f172a}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#bar{position:fixed;left:12px;bottom:8px;right:12px;font:12px system-ui,sans-serif;color:#fff;opacity:.55;display:flex;flex-wrap:wrap;gap:6px 14px}
#bar:hover{opacity:1}
#bar a{color:#fff;text-decoration:none;cursor:pointer}#bar a:hover{text-decoration:underline}
#ed{position:fixed;inset:0;background:#0f172af2;display:none;flex-direction:column;gap:10px;padding:12px;font-family:system-ui,sans-serif;color:#fff}
#ed.on{display:flex}
#ed h2{margin:0;font-weight:500;font-size:16px}
#ed textarea{flex:1;width:100%;box-sizing:border-box;background:#020617;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:none;tab-size:2}
#ed .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
#ed button{border:0;border-radius:8px;padding:10px 16px;font-size:14px;color:#fff;background:#334155;cursor:pointer}
#ed button.pri{background:#2563eb}
#msg{margin-right:auto;font-size:12px;opacity:.8}
</style>
</head>
<body>
<iframe id="v" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Aistim.sync"></iframe>
<div id="bar">
  <a id="back" href="../newtab.html">Kembali ke Board</a>
  <a id="edit" href="#">Edit</a>
  <a id="cp" href="#">Salin</a>
  <a id="dl" href="#">Unduh</a>
  <a id="imp" href="#">Impor file</a>
  <a id="reset" href="#" hidden>Kembalikan dari GitHub</a>
  <span id="note" hidden></span>
  <input id="file" type="file" accept=".html,text/html" hidden>
</div>
<div id="ed">
  <h2>Edit HTML Aistim.sync</h2>
  <textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <div class="row"><span id="msg"></span><button id="copy2" type="button">Salin</button><button id="cancel" type="button">Batal</button><button id="save" class="pri" type="button">Simpan</button></div>
</div>
<script src="sync.js"></script>
</body>
</html>
