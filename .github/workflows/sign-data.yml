name: Sign data

# Menandatangani data/tiles.json, data/sync.html, dan data/menu.json dengan private key admin
# (secret AISTIM_PRIVATE, 64 karakter hex) lalu mengommit berkas *.sig ke main.
# Extension hanya memakai data dari GitHub bila ada .sig yang cocok dengan public key admin (extension/menu/verify.js).
#
# Cara pakai: GitHub -> Actions -> "Sign data" -> Run workflow (bisa dari aplikasi GitHub di HP).
# Hanya manual, tidak jalan otomatis saat push. Alasannya: berkas data akan ditandatangani apa adanya,
# jadi periksa dulu commit terbaru yang menyentuh data/. Isi "sha" bila ingin memastikan main tidak
# bergeser antara pemeriksaan dan penandatanganan.
#
# Perlindungan private key:
#  - hanya langkah "Tandatangani" yang memegang AISTIM_PRIVATE; langkah push tidak menjalankan kode repo;
#  - kode yang berjalan bersama key (tools/sign.mjs dan extension/sdk/secp256k1.js, hanya memakai modul bawaan Node)
#    dikunci dengan hash di bawah. Bila berubah, langkah berhenti sebelum key dipakai. Orang yang hanya bisa
#    mendorong isi repo (mis. token upload di browser) tidak bisa mengubah berkas workflow ini tanpa izin Workflows.
#  - berjalan hanya dari branch main.
# Setelah SENGAJA mengubah salah satu dari dua berkas itu, perbarui hash:
#   sha256sum tools/sign.mjs extension/sdk/secp256k1.js

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Opsional: awal SHA commit main yang sudah diperiksa. Berhenti bila main sudah bergeser."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sign-data
  cancel-in-progress: false

env:
  SIGN_SHA256: ff9d832e2380df56dc0361474c9273abf5b62cb4102cfed7bff484d23652881b
  SDK_SHA256: 76ed78599619b27a28403fb0e43920b64d7c9847f27f1d0a5f62ef2ac1e8f449

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Periksa commit yang diminta
        env:
          WANT: ${{ inputs.sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "main = $HEAD_SHA"
          if [ -n "$WANT" ] && [[ "$HEAD_SHA" != "$WANT"* ]]; then
            echo "::error::main sudah bergeser ke $HEAD_SHA (diminta $WANT). Periksa commit terbaru lalu jalankan lagi."
            exit 1
          fi

      - name: Kunci penandatangan
        run: |
          echo "$SIGN_SHA256  tools/sign.mjs" | sha256sum -c -
          echo "$SDK_SHA256  extension/sdk/secp256k1.js" | sha256sum -c -

      - name: Tandatangani
        env:
          AISTIM_ADMIN_KEY: ${{ secrets.AISTIM_PRIVATE }}
        run: |
          if [ -z "$AISTIM_ADMIN_KEY" ]; then
            echo "::error::Secret AISTIM_PRIVATE belum diisi."
            exit 1
          fi
          if ! [[ "$AISTIM_ADMIN_KEY" =~ ^[[:space:]]*(0x)?[0-9a-fA-F]{64}[[:space:]]*$ ]]; then
            echo "::error::AISTIM_PRIVATE harus private key 64 karakter hex (bukan PEM)."
            exit 1
          fi
          FILES=""
          for f in data/tiles.json data/sync.html data/menu.json; do
            if [ -f "$f" ]; then FILES="$FILES $f"; else echo "Lewati $f (tidak ada)"; fi
          done
          [ -n "$FILES" ] || { echo "::error::Tidak ada berkas data untuk ditandatangani."; exit 1; }
          node tools/sign.mjs $FILES

      - name: Commit tanda tangan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add data/*.sig
          if git diff --cached --quiet; then
            echo "Tanda tangan sudah sesuai, tidak ada yang perlu di-commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tanda tangan data: $(git diff --cached --name-only | tr '\n' ' ')[skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
