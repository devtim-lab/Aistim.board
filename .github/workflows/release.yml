name: Release

# Saat "version" di extension/manifest.json naik, dibuat tag + release dengan
# Aistim-Board-<versi>.zip (manifest.json di ROOT zip, siap "Load unpacked" atau upload Web Store).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ZIP="Aistim-Board-$VERSION.zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          (cd extension && zip -r "../$ZIP" .)
          unzip -l "$ZIP" | grep -E ' manifest\.json$'
      - name: Create release / upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Aistim Board v$VERSION" --notes "Unduh **$ZIP** lalu Load unpacked (ekstrak dulu). Lihat README untuk fitur." --latest
          fi
