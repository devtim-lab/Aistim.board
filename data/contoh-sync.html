<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#7c3aed)}
.box{width:min(560px,100%);text-align:center}
h1{font-weight:300;font-size:clamp(40px,10vw,84px);letter-spacing:-1px}
p{opacity:.8;margin:8px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
a{display:block;padding:18px 10px;border-radius:12px;background:#ffffff1f;color:#fff;text-decoration:none;
  border:1px solid #ffffff33;transition:transform .15s,background .15s}
a:hover{background:#ffffff33;transform:translateY(-2px)}
small{display:block;margin-top:28px;opacity:.5;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <h1>Hallo, Aistim</h1>
  <p>Ini halaman tes Aistim.sync. Edit HTML ini sesukamu.</p>
  <div class="grid">
    <a href="https://www.google.com" target="_blank">Google</a>
    <a href="https://github.com" target="_blank">GitHub</a>
    <a href="https://www.youtube.com" target="_blank">YouTube</a>
    <a href="https://www.bing.com" target="_blank">Bing</a>
  </div>
  <small>Aistim.sync · HTML + CSS saja (skrip tidak berjalan)</small>
</div>
</body>
</html>
